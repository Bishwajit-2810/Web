<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Layout Structure</title>
    <style>
      body {
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      table {
        width: 80%;
        height: 90%;
        border-collapse: collapse;
        border: 2px solid white;
        text-align: center;
      }

      td {
        border: 1px solid white;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <table>
      <!-- Row 1 & 2 combined (a–d) -->
      <tr>
        <td rowspan="2">a</td>
        <td rowspan="2">b</td>
        <td rowspan="2">c</td>
        <td rowspan="2">d</td>
      </tr>
      <tr></tr>

      <!-- Row 3–4: e spans 2 rows, f & g on right -->
      <tr>
        <td rowspan="2">e</td>
        <td colspan="3">f</td>
      </tr>
      <tr>
        <td colspan="3">g</td>
      </tr>

      <!-- Row 5: h + i -->
      <tr>
        <td>h</td>
        <td colspan="3">i</td>
      </tr>

      <!-- Rows 6–8: bottom structure j, k, l, m, n -->
      <tr>
        <td rowspan="3">j</td>
        <td rowspan="2">k</td>
        <td colspan="2">l</td>
      </tr>
      <tr>
        <td colspan="2">m</td>
      </tr>
      <tr>
        <td colspan="3">n</td>
      </tr>
    </table>
  </body>
</html>
