<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout Structure</title>
    <style>
      body {
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 80%;
        height: 90%;
        border: 2px solid white;
      }

      .box {
        border: 1px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
      }

      /* Grid Positioning */
      .a {
        grid-row: 1 / 3;
        grid-column: 1;
      }
      .b {
        grid-row: 1 / 3;
        grid-column: 2;
      }
      .c {
        grid-row: 1 / 3;
        grid-column: 3;
      }
      .d {
        grid-row: 1 / 3;
        grid-column: 4;
      }

      .e {
        grid-row: 3 / 5; /* spans 2 rows now */
        grid-column: 1;
      }
      .f {
        grid-row: 3;
        grid-column: 2 / 5;
      }
      .g {
        grid-row: 4;
        grid-column: 2 / 5;
      }

      .h {
        grid-row: 5;
        grid-column: 1;
      }
      .i {
        grid-row: 5;
        grid-column: 2 / 5;
      }

      .j {
        grid-row: 6 / 9;
        grid-column: 1;
      }
      .k {
        grid-row: 6 / 8;
        grid-column: 2;
      }
      .l {
        grid-row: 6;
        grid-column: 3 / 5;
      }
      .m {
        grid-row: 7;
        grid-column: 3 / 5;
      }
      .n {
        grid-row: 8;
        grid-column: 2 / 5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box a">a</div>
      <div class="box b">b</div>
      <div class="box c">c</div>
      <div class="box d">d</div>

      <div class="box e">e</div>
      <div class="box f">f</div>
      <div class="box g">g</div>

      <div class="box h">h</div>
      <div class="box i">i</div>

      <div class="box j">j</div>
      <div class="box k">k</div>
      <div class="box l">l</div>
      <div class="box m">m</div>
      <div class="box n">n</div>
    </div>
  </body>
</html>
