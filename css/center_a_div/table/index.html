<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Centering</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: table;
        width: 100%;
        background: #f0f0f0;
      }
      .table-cell {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
      }
      .centered {
        display: inline-block;
        width: 300px;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="table-cell">
      <div class="centered">
        <h1>Table Centered</h1>
        <p>This div is centered using table display</p>
      </div>
    </div>
  </body>
</html>
