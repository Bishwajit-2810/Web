<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Auto Centering</title>
    <style>
      body {
        margin: 0;
        padding-top: 100px;
        background: #f0f0f0;
      }
      .centered {
        width: 300px;
        margin: 0 auto;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="centered">
      <h1>Margin Auto Centered</h1>
      <p>This div is horizontally centered using margin: auto</p>
    </div>
  </body>
</html>
