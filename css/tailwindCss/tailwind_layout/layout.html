<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <!-- equal portion -->

    <h2 class="text-center">equal portion</h2>
    <div class="mt-4 p-4 grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-gray-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-amber-700 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-green-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-sky-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-orange-900 min-h-[100px] rounded-lg shadow"></div>
    </div>

    <div class="mt-4 p-4 grid sm:grid-cols-4 gap-4">
      <div class="bg-gray-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-amber-700 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-green-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-sky-900 min-h-[100px] rounded-lg shadow"></div>
      <div class="bg-orange-900 min-h-[100px] rounded-lg shadow"></div>
    </div>

    <!-- non equal portion -->
    <h2 class="text-center">non equal portion</h2>
    <div class="mt-4 p-4 grid sm:grid-cols-12 grid-cols-1 gap-4">
      <div
        class="bg-gray-900 min-h-[100px] rounded-lg shadow sm:col-span-2"
      ></div>
      <div
        class="bg-amber-700 min-h-[100px] rounded-lg shadow sm:col-span-10"
      ></div>
    </div>

    <div class="mt-4 p-4 grid sm:grid-cols-12 gap-4">
      <div
        class="bg-gray-900 min-h-[100px] rounded-lg shadow sm:col-span-2 sm:block hidden"
      ></div>
      <div
        class="bg-amber-700 min-h-[100px] rounded-lg shadow sm:col-span-8"
      ></div>
      <div
        class="bg-green-900 min-h-[100px] rounded-lg shadow sm:col-span-2 sm:block"
      ></div>
    </div>
  </body>
</html>
