<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavBar</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: white;
      }
      .nav-container {
        margin-bottom: 40px;
      }
      h2 {
        margin-bottom: 10px;
      }

      .nav1 {
        border-radius: 5px;
        background-color: #484848;
        padding: 10px;
      }
      .nav1 ul {
        list-style-type: none;
        display: flex;
        justify-content: space-around;
        margin: 0;
        padding: 0;
      }
      .nav1 li {
        display: inline;
      }
      .nav1 a {
        text-decoration: none;
        color: white;
        /* background-color: #d45b04; */
        padding: 5px 15px;
        position: relative;
      }
      .nav1 .login-btn {
        background-color: #254bf6;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .nav1 a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        left: 0px;
        background-color: #254bf6;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav1 a:hover::after {
        transform: scaleX(1);
      }

      /* 2nd nav bar */

      .nav2 {
        border-radius: 5px;
        background-color: #484848;
        padding: 20px;
        text-align: center;
        width: 500px;
      }
      .nav2 ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      .nav2 li {
        margin-bottom: 8px;
      }
      .nav2 a {
        color: white;
        text-decoration: none;
        display: block;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      }
      .nav2 a:hover {
        background-color: #376b32;
        border-radius: 8px;
      }
      .nav2 .login-btn {
        background-color: #048a2f;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        padding: 8px;
      }
      .nav2 .login-btn:hover {
        background-color: #075821;
        border: 1px solid white;
      }

      /* 3rd nav bar */

      .nav3 {
        border-radius: 5px;
        background-color: #484848;
        padding: 10px;
      }
      .nav3 ul {
        list-style-type: none;
        display: flex;
        justify-content: space-around;
        margin: 0;
        padding: 0;
        align-items: center;
      }
      .nav3 li {
        display: inline;
      }
      .nav3 a {
        text-decoration: none;
        color: white;
        /* background-color: #d45b04; */
        padding: 5px 15px;
        position: relative;
        display: block;
      }
      .nav3 .dropdown-content {
        display: none;
      }
      .nav3 .dropdown:hover .dropdown-content {
        display: block;
        position: absolute;
        padding: 5px;
        background-color: #645a5a;
        border-radius: 5px;
      }
      .nav3 .login-btn {
        background-color: #254bf6;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .nav3 a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        left: 0px;
        background-color: #142777;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav3 a:hover::after {
        transform: scaleX(1);
      }
    </style>
  </head>
  <body>
    <div class="nav-container">
      <h2>Variation 1: Horizontal with underline effect</h2>
      <nav class="nav1">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
    <div class="nav-container">
      <h2>Variation 2: vertical with effect</h2>
      <nav class="nav2">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
    <div class="nav-container">
      <h2>Variation 3: Horizontal with dropdown</h2>
      <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">
            <a href="#">About</a>
            <div class="dropdown-content">
              <a href="#">Our Story</a>
              <a href="#">Team</a>
              <a href="#">Contact</a>
            </div>
          </li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
