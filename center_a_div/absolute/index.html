<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute Centering</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        position: relative;
        background: #f0f0f0;
      }
      .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="centered">
      <h1>Absolute Centered</h1>
      <p>This div is centered using absolute positioning</p>
    </div>
  </body>
</html>
