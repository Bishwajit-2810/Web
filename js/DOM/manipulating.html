<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manipulating Elements in JavaScript</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      ul {
        padding: 10px;
        background: #f0f0f0;
        border: 1px solid #ccc;
      }
      li {
        margin: 5px 0;
      }
      h2,
      header,
      footer {
        margin-top: 15px;
        color: darkblue;
      }
      #clonedMenu {
        margin-top: 20px;
        background: #e0f7fa;
      }
    </style>
  </head>
  <body>
    <header>Original Page Header (will be replaced by JS)</header>

    <h1>DOM Manipulation Demo</h1>

    <p>This unordered list will be manipulated with JavaScript:</p>
    <ul id="menu">
      <li>home</li>
      <li>about</li>
      <li>blog</li>
    </ul>

    <footer>Original Page Footer (will be replaced by JS)</footer>

    <script src="./manipulatingElement.js"></script>
  </body>
</html>
