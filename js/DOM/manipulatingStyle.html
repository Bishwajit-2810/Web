<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manipulating Styles</title>
    <style>
      /* Some default styles */
      #myBox {
        width: 150px;
        height: 150px;
        background-color: lightblue;
        border: 2px solid black;
        margin: 20px;
      }

      .highlight {
        background-color: yellow;
        border: 3px dashed red;
      }

      .rounded {
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <h1>DOM Style Manipulation Demo</h1>

    <div id="myBox">Box Element</div>

    <script src="./manipulatingElement.js"></script>
  </body>
</html>
